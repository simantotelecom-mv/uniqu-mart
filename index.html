<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ইউনিক মার্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f2f7f7;--cd:#fff;--tx:#14262a;--mu:#5d7276;--br:#dbe6e7;--pr:#0b5d63;--pl:#dff0f0;--rd:#d4513a;--gn:#18875a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1819;--cd:#162426;--tx:#e6f1f1;--mu:#8ea6a9;--br:#25393c;--pr:#4cc4c0;--pl:#1b3638;--rd:#ef7f6a;--gn:#4cc98f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Hind Siliguri",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
.w{max-width:520px;margin:0 auto;padding:12px}
.mq{overflow:hidden;white-space:nowrap;background:var(--pr);color:#fff;border-radius:14px;padding:9px 0;font-weight:500}
.mq span{display:inline-block;padding-left:100%;animation:m 22s linear infinite}
@keyframes m{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.mq span{animation:none;padding:0 12px}}
.c{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:14px;margin-top:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.k{background:var(--cd);border:1px solid var(--br);border-radius:12px;padding:10px 12px}
.k small{color:var(--mu);display:block}.k b{font-size:20px;font-weight:600}
h3{margin:0 0 8px;font-size:16px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--br);background:var(--cd);color:var(--tx);cursor:pointer}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.r{display:flex;gap:8px}.r>*{flex:1}
.i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--br)}
.i small{color:var(--mu)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px}
.nav button.a{color:var(--pr);font-weight:600;box-shadow:inset 0 3px var(--pr)}
.rd{color:var(--rd)}.gn{color:var(--gn)}.mu{color:var(--mu)}
.x{background:none;border:0;padding:4px 8px;color:var(--mu)}
</style></head><body>
<div class="w" id="app"></div>
<script>
const SB_URL='https://omxphhnwsxxmivvopwry.supabase.co', SB_KEY='sb_publishable_MxZA3aCWiUP7ttdMjpQYog_kEiAogUm';
const sb=supabase.createClient(SB_URL,SB_KEY);
let me,role='staff',S={},E=[],C=[],L=[],tab='home',open_=null;
const $=id=>document.getElementById(id);
const M=n=>'MVR '+Number(n||0).toLocaleString('en');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC=[['কোকা','🥤'],['cola','🥤'],['ড্রিংক','🥤'],['জুস','🧃'],['পানি','💧'],['কফি','☕'],['coffee','☕'],['চা','🍵'],['মাছ','🐟'],['fish','🐟'],['মাংস','🥩'],['meat','🥩'],['মুরগি','🍗'],['ডিম','🥚'],['আপেল','🍎'],['কলা','🍌'],['ফল','🍎'],['বিস্কিট','🍪'],['biscuit','🍪'],['ফ্লেক্সি','📱'],['flexi','📱'],['বিকাশ','💰'],['bkash','💰']];
function ic(n){n=(n||'').toLowerCase();const m=JSON.parse(localStorage.im||'{}');if(m[n])return m[n];for(const[k,v]of IC)if(n.includes(k))return v;return'📦'}
function learn(n){const k=n.toLowerCase();if(!n||ic(n)!=='📦')return;const e=prompt('এই পণ্যের জন্য একটা ছবি (ইমোজি) দিন, না চাইলে খালি রাখুন');if(e){const m=JSON.parse(localStorage.im||'{}');m[k]=e;localStorage.im=JSON.stringify(m)}}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  me=session.user;
  const{data:p}=await sb.from('profiles').select('role').eq('id',me.id).single();
  role=p?.role||'staff';await load();
}
function loginView(){
  $('app').innerHTML=`<div class="c" style="margin-top:20vh"><h3>ইউনিক মার্ট</h3>
  <input id="em" type="email" placeholder="ইমেইল" autocomplete="username">
  <input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
  <button class="p" style="width:100%" onclick="doLogin()">লগইন</button><p id="er" class="rd"></p></div>`;
}
async function doLogin(){
  const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)$('er').textContent='ইমেইল বা পাসওয়ার্ড ভুল';else init();
}
async function load(){
  const[a,b,c,d]=await Promise.all([
    sb.from('entries').select('*').order('created_at',{ascending:false}).limit(300),
    sb.from('customers').select('*').order('name'),
    sb.from('ledger').select('*').order('created_at'),
    sb.from('settings').select('*')]);
  E=a.data||[];C=b.data||[];L=c.data||[];S={};(d.data||[]).forEach(r=>S[r.key]=r.value);render();
}
const due=id=>L.filter(x=>x.customer_id==id).reduce((s,x)=>s+(x.kind==='due'?1:-1)*Number(x.amount),0);
const today=e=>new Date(e.created_at).toDateString()===new Date().toDateString();
const fmt=d=>new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

function render(){
  const T=E.filter(today),sale=T.filter(e=>e.kind==='sale').reduce((s,e)=>s+Number(e.amount),0),
  exp=T.filter(e=>e.kind==='expense').reduce((s,e)=>s+Number(e.amount),0),
  tot=C.reduce((s,c)=>s+due(c.id),0);
  let v='';
  if(tab==='home')v=`<div class="g">
   <div class="k"><small>আজকের বিক্রি</small><b>${M(sale)}</b></div>
   <div class="k"><small>আজকের খরচ</small><b>${M(exp)}</b></div>
   <div class="k"><small>আজকের লাভ</small><b class="${sale-exp>=0?'gn':'rd'}">${M(sale-exp)}</b></div>
   <div class="k"><small>মোট বাকি</small><b class="rd">${M(tot)}</b></div>
   <div class="k"><small>📱 ফ্লেক্সি ব্যালেন্স</small><b>${M(S.flexi)}</b></div>
   <div class="k"><small>💰 বিকাশ ব্যালেন্স</small><b>${M(S.bkash)}</b></div></div>
   <div class="c"><h3>নতুন লেখা</h3>
   <select id="ek"><option value="sale">বিক্রি</option><option value="expense">খরচ</option></select>
   <input id="en" placeholder="পণ্যের নাম (যেমন কফি, মাছ)" oninput="$('pv').textContent=ic(this.value)">
   <div class="r"><div id="pv" style="flex:0 0 44px;font-size:28px;text-align:center">📦</div><input id="ea" type="number" inputmode="decimal" placeholder="অঙ্ক (MVR)"></div>
   <button class="p" style="width:100%" onclick="addE()">যোগ করুন</button></div>
   <div class="c"><h3>আজকের তালিকা</h3>${T.length?T.map(e=>`<div class="i"><span>${ic(e.name)} ${esc(e.name||(e.kind==='sale'?'বিক্রি':'খরচ'))}<br><small>${fmt(e.created_at)}</small></span>
   <span class="${e.kind==='sale'?'gn':'rd'}">${e.kind==='sale'?'+':'−'}${Number(e.amount)}${role==='admin'?`<button class="x" aria-label="মুছুন" onclick="del('entries',${e.id})">✕</button>`:''}</span></div>`).join(''):'<p class="mu">আজ এখনও কিছু লেখা হয়নি। উপরে প্রথম লেখাটা যোগ করুন।</p>'}</div>`;
  if(tab==='due')v=open_?detail():`<div class="c"><h3>নতুন কাস্টমার</h3><input id="cn" placeholder="নাম"><input id="cp" inputmode="numeric" maxlength="7" placeholder="ফোন (৭ অঙ্ক)"><button class="p" style="width:100%" onclick="addC()">যোগ করুন</button></div>
   <div class="c"><h3>বাকির তালিকা</h3>${C.length?[...C].sort((a,b)=>due(b.id)-due(a.id)).map(c=>`<div class="i" onclick="open_=${c.id};render()" style="cursor:pointer"><span>${esc(c.name)}<br><small>${esc(c.phone||'')}</small></span><b class="${due(c.id)>0?'rd':'gn'}">${M(due(c.id))}</b></div>`).join(''):'<p class="mu">এখনও কোনো কাস্টমার নেই।</p>'}</div>`;
  if(tab==='more')v=`<div class="c"><h3>সেটিং</h3><p class="mu">আপনি: ${role==='admin'?'অ্যাডমিন':'কর্মচারী'}</p>
   ${role==='admin'?`<div class="r"><button onclick="setS('shop','দোকানের নাম')">দোকানের নাম</button><button onclick="setS('phone','দোকানের ফোন')">ফোন</button></div>
   <div class="r" style="margin-top:8px"><button onclick="setS('flexi','ফ্লেক্সি ব্যালেন্স')">ফ্লেক্সি</button><button onclick="setS('bkash','বিকাশ ব্যালেন্স')">বিকাশ</button></div>
   <div class="r" style="margin-top:8px"><button onclick="setS('pin','নতুন পিন (৪ অঙ্ক)')">পিন বদল</button><button onclick="backup()">ব্যাকআপ</button></div>`:''}
   <button style="width:100%;margin-top:12px" onclick="sb.auth.signOut().then(init)">লগআউট</button></div>`;
  $('app').innerHTML=`<div class="mq"><span>${esc(S.shop||'ইউনিক মার্ট')} — আজকের বিক্রি ${M(sale)} — মোট বাকি ${M(tot)} — স্বাগতম</span></div>${v}
  <div class="nav">${[['home','হিসাব'],['due','বাকি'],['more','আরও']].map(([k,n])=>`<button class="${tab===k?'a':''}" onclick="tab='${k}';open_=null;render()">${n}</button>`).join('')}</div>`;
}
function detail(){
  const c=C.find(x=>x.id==open_),h=L.filter(x=>x.customer_id==open_);
  return`<button onclick="open_=null;render()">← ফিরে যান</button><div class="c"><h3>${esc(c.name)}</h3><p class="mu">${esc(c.phone||'ফোন নেই')}</p>
  <p>মোট বাকি<br><b class="rd" style="font-size:26px">${M(due(c.id))}</b></p>
  <input id="la" type="number" inputmode="decimal" placeholder="অঙ্ক লিখুন">
  <div class="r"><button onclick="tx('due')">বাকি দিলাম</button><button class="p" onclick="tx('pay')">টাকা পেলাম</button></div></div>
  <div class="c"><h3>মেমো পাঠান</h3><div class="r"><button onclick="send('wa')">WhatsApp</button><button onclick="send('sms')">SMS</button><button onclick="window.print()">প্রিন্ট</button></div></div>
  <div class="c"><h3>ইতিহাস</h3>${[...h].reverse().map(x=>`<div class="i"><span>${x.kind==='due'?'বাকি':'পেলাম'}<br><small>${fmt(x.created_at)}</small></span><span class="${x.kind==='due'?'rd':'gn'}">${Number(x.amount)}${role==='admin'?`<button class="x" aria-label="মুছুন" onclick="del('ledger',${x.id})">✕</button>`:''}</span></div>`).join('')||'<p class="mu">কোনো লেখা নেই।</p>'}
  ${role==='admin'?`<button style="width:100%;margin-top:10px" onclick="del('customers',${c.id})">কাস্টমার মুছুন</button>`:''}</div>`;
}
async function addE(){
  const a=Number($('ea').value),n=$('en').value.trim();
  if(!(a>0))return alert('সঠিক অঙ্ক লিখুন');
  learn(n);
  const{error}=await sb.from('entries').insert({kind:$('ek').value,name:n,amount:a});
  if(error)return alert('সেভ হয়নি, আবার চেষ্টা করুন');load();
}
async function addC(){
  const n=$('cn').value.trim(),p=$('cp').value.trim();
  if(!n)return alert('নাম লিখুন');
  if(p&&!/^[79]\d{6}$/.test(p))return alert('মালদ্বীপের ৭ অঙ্কের নম্বর দিন');
  const{error}=await sb.from('customers').insert({name:n,phone:p});
  if(error)return alert('সেভ হয়নি');load();
}
async function tx(kind){
  const a=Number($('la').value);
  if(!(a>0))return alert('সঠিক অঙ্ক লিখুন');
  if(kind==='pay'&&a>due(open_))return alert('বাকির চেয়ে বেশি লেখা যাবে না');
  const{error}=await sb.from('ledger').insert({customer_id:open_,kind,amount:a});
  if(error)return alert('সেভ হয়নি');await load();
}
function memo(){
  const c=C.find(x=>x.id==open_),l=L.filter(x=>x.customer_id==open_).slice(-1)[0];
  return`${S.shop||'ইউনিক মার্ট'}\nমেমো\nনাম: ${c.name}\nতারিখ: ${new Date().toLocaleString('en-GB')}\n${l?(l.kind==='due'?'বাকি: ':'পেয়েছি: ')+M(l.amount)+'\n':''}মোট বাকি: ${M(due(open_))}\nধন্যবাদ${S.phone?'\nফোন: '+S.phone:''}`;
}
function send(w){
  const c=C.find(x=>x.id==open_);
  if(!c.phone)return alert('এই কাস্টমারের ফোন নম্বর নেই');
  const t=encodeURIComponent(memo());
  location.href=w==='wa'?`https://wa.me/960${c.phone}?text=${t}`:`sms:+960${c.phone}?body=${t}`;
}
async function del(t,id){
  if(role!=='admin')return alert('শুধু অ্যাডমিন মুছতে পারবে');
  if(prompt('পিন দিন')!==(S.pin||'1234'))return alert('পিন ভুল, মোছা হয়নি');
  const{error}=await sb.from(t).delete().eq('id',id);
  if(error)return alert('মোছা যায়নি');if(t==='customers')open_=null;load();
}
async function setS(k,label){
  const v=prompt(label,S[k]||'');if(v===null)return;
  const{error}=await sb.from('settings').upsert({key:k,value:v.trim()});
  if(error)return alert('সেভ হয়নি');load();
}
function backup(){
  const b=new Blob([JSON.stringify({E,C,L,S},null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='unique-mart-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
init();
</script></body></html>
