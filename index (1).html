  tot=C.reduce((s,c)=>s+due(c.id),0);
  const pf=sale-exp-T.filter(e=>e.kind!=='expense').reduce((s,e)=>s+cg(e),0);
  let v='';
  if(tab==='home')v=`<div class="g">
   <div class="k"><small>আজকের বিক্রি</small><b>${M(sale)}</b></div>
   ${role==='admin'?`<div class="k"><small>আজকের খরচ</small><b>${M(exp)}</b></div>`:''}
   ${role==='admin'?`<div class="k"><small>আজকের লাভ</small><b class="${pf>=0?'gn':'rd'}">${M(pf)}</b></div>`:''}
   <div class="k"><small>মোট বাকি</small><b class="rd">${M(tot)}</b></div>
   ${role==='admin'?`<div class="k"><small>📱 ফ্লেক্সি ব্যালেন্স</small><b>${M(S.flexi)}</b></div>`:''}
   ${role==='admin'?`<div class="k"><small>💰 বিকাশ ব্যালেন্স</small><b>${M(S.bkash)}</b></div>`:''}</div>
   <div class="c"><h3>নতুন লেখা</h3>
   <select id="ek"><option value="sale">বিক্রি</option><option value="expense">খরচ</option><option value="waste">নষ্ট মাল</option></select>
   <div class="r"><input id="en" list="pl" placeholder="পণ্যের নাম (যেমন কফি, মাছ)" oninput="pk(this)"><button style="flex:0 0 48px;margin-bottom:8px" onclick="mic()" aria-label="ভয়েস">🎤</button></div><datalist id="pl">${PR.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
   <div class="r"><div id="pv" style="flex:0 0 44px;font-size:28px;text-align:center">📦</div><input id="eq" type="number" inputmode="decimal" value="1" placeholder="পরিমাণ" oninput="pk($('en'))" style="flex:0 0 80px"><input id="ea" type="number" inputmode="decimal" placeholder="অঙ্ক (MVR)"></div>
   <button class="p" style="width:100%" onclick="addE()">যোগ করুন</button></div>${role==='admin'?`<div class="c"><h3>দিনের শেষে নগদ মেলান</h3><input id="co" type="number" inputmode="decimal" placeholder="সকালে হাতে কত ছিল"><input id="cc" type="number" inputmode="decimal" placeholder="এখন হাতে কত আছে"><button style="width:100%" onclick="cclose()">মেলান</button><p id="ccr" style="font-weight:600"></p></div>`:''}
   <div class="c"><h3>আজকের তালিকা</h3>${T.length?T.map(e=>`<div class="i"><span>${ic(e.name)} ${esc(e.name||(e.kind==='sale'?'বিক্রি':'খরচ'))}<br><small>${fmt(e.created_at)}${role==='admin'?' · '+esc(P[e.created_by]||''):''}</small></span>
   <span class="${e.kind==='sale'?'gn':'rd'}">${e.kind==='sale'?'+':'−'}${Number(e.amount)}${role==='admin'?`<button class="x" aria-label="মুছুন" onclick="del('entries',${e.id})">✕</button>`:''}</span></div>`).join(''):'<p class="mu">আজ এখনও কিছু লেখা হয়নি। উপরে প্রথম লেখাটা যোগ করুন।</p>'}</div>`;
  if(tab==='due')v=open_?detail():`<div class="c"><h3>নতুন কাস্টমার</h3><input id="cn" placeholder="নাম"><input id="cp" inputmode="numeric" maxlength="7" placeholder="ফোন (৭ অঙ্ক)"><button class="p" style="width:100%" onclick="addC()">যোগ করুন</button></div>
   <div class="c"><h3>বাকির তালিকা</h3>${C.length?[...C].sort((a,b)=>due(b.id)-due(a.id)).map(c=>`<div class="i" onclick="open_=${c.id};render()" style="cursor:pointer"><span>${esc(c.name)}<br><small>${esc(c.phone||'')}</small></span><b class="${due(c.id)>0?'rd':'gn'}">${M(due(c.id))}</b></div>`).join(''):'<p class="mu">এখনও কোনো কাস্টমার নেই।</p>'}</div>`;
  if(tab==='more')v=`<div class="c"><h3>সেটিং</h3><div class="r" style="margin-bottom:10px"><button onclick="setLang('bn')">বাংলা</button><button onclick="setLang('en')">English</button></div><p class="mu" style="margin:0 0 6px">থিম</p><div class="r" style="margin-bottom:10px">${[['ocean','#0b5d63'],['green','#1c7c3f'],['royal','#2547c9'],['sunset','#d9541e'],['purple','#7a3fd1'],].map(([k,c])=>`<button class="sw" aria-label="${k}" style="background:${c}" onclick="setTheme('${k}')"></button>`).join('')}</div><div class="r" style="margin-bottom:10px"><button onclick="setMode('light')">হালকা</button><button onclick="setMode('dark')">গাঢ়</button><button onclick="setMode('auto')">অটো</button></div><p class="mu">আপনি: ${role==='admin'?'অ্যাডমিন':'কর্মচারী'}</p>
   ${role==='admin'?`<div class="r"><button onclick="setS('shop','দোকানের নাম')">দোকানের নাম</button><button onclick="setS('phone','দোকানের ফোন')">ফোন</button></div>
   <div class="r" style="margin-top:8px"><button onclick="setS('flexi','ফ্লেক্সি ব্যালেন্স')">ফ্লেক্সি</button><button onclick="setS('bkash','বিকাশ ব্যালেন্স')">বিকাশ</button></div>
   <div class="r" style="margin-top:8px"><button onclick="setS('pin','নতুন পিন (৪ অঙ্ক)')">পিন বদল</button><button onclick="backup()">ব্যাকআপ</button></div>`:''}
   <button style="width:100%;margin-top:12px" onclick="rec=true;render()">পাসওয়ার্ড বদল</button><button style="width:100%;margin-top:8px" onclick="sb.auth.signOut().then(init)">লগআউট</button></div>${role==='admin'?`<div class="c"><h3>পণ্য তালিকা</h3><input id="pn2" placeholder="পণ্যের নাম"><div class="r"><select id="pu"><option value="pcs">পিস</option><option value="kg">কেজি</option></select><input id="pb" type="number" inputmode="decimal" placeholder="কেনা দাম"><input id="ps" type="number" inputmode="decimal" placeholder="বেচা দাম"></div><button class="p" style="width:100%" onclick="addP()">যোগ করুন</button>${PR.map(p=>`<div class="i"><span>${ic(p.name)} ${esc(p.name)}<br><small>${p.unit==='kg'?'কেজি':'পিস'} · কেনা দাম ${cost(p.id)} · বেচা দাম ${Number(p.sell)}</small></span><button class="x" aria-label="মুছুন" onclick="del('products',${p.id})">✕</button></div>`).join('')}</div>`:''}`;
  if(tab==='rep'){const mo=MO||ym(new Date()),X=E.filter(e=>ym(e.created_at)===mo),sl=X.filter(e=>e.kind==='sale'),sa=sl.reduce((s,e)=>s+Number(e.amount),0),ex=X.filter(e=>e.kind==='expense').reduce((s,e)=>s+Number(e.amount),0),wl=X.filter(e=>e.kind==='waste').reduce((s,e)=>s+cg(e),0),cs=sl.reduce((s,e)=>s+cg(e),0),by={};
   sl.forEach(e=>{const k=e.name||'—';by[k]=by[k]||{q:0,a:0,p:0};by[k].q+=Number(e.qty||1);by[k].a+=Number(e.amount);by[k].p+=Number(e.amount)-cg(e)});
   const row=(n,x,c)=>`<div class="i"><span>${n}</span><b class="${c||''}">${M(x)}</b></div>`;
   v=`<div class="c"><h3>মাসের রিপোর্ট</h3><input type="month" value="${mo}" onchange="MO=this.value;render()">${row('বিক্রি',sa)}${row('পণ্যের কেনা খরচ',cs)}${row('নষ্ট মাল',wl)}${row('অন্যান্য খরচ',ex)}${row('নিট লাভ',sa-cs-wl-ex,sa-cs-wl-ex>=0?'gn':'rd')}<button style="width:100%;margin-top:10px" onclick="window.print()">প্রিন্ট / PDF</button></div>
   <div class="c"><h3>পণ্য অনুযায়ী লাভ</h3>${Object.entries(by).sort((a,b)=>b[1].p-a[1].p).map(([k,o])=>`<div class="i"><span>${ic(k)} ${esc(k)}<br><small>বিক্রি ${o.q} · ${M(o.a)}</small></span><b class="${o.p>=0?'gn':'rd'}">${M(o.p)}</b></div>`).join('')||'<p class="mu">এই মাসে কোনো বিক্রি নেই।</p>'}</div>`}
  if(tab==='log'){
   const R=[...E.map(e=>({t:e.created_at,u:e.created_by,x:(e.kind==='sale'?'বিক্রি ':'খরচ ')+(e.name||'')+' '+Number(e.amount)})),...L.map(l=>({t:l.created_at,u:l.created_by,x:(l.kind==='due'?'বাকি ':'টাকা পেলাম ')+((C.find(c=>c.id==l.customer_id)||{}).name||'')+' '+Number(l.amount)}))].sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,80);
   v=`<div class="c"><h3>কে কী লিখেছে</h3>${R.map(r=>`<div class="i"><span>${esc(r.x)}<br><small>${esc(P[r.u]||'?')} · ${fmt(r.t)}</small></span></div>`).join('')||'<p class="mu">কিছু নেই।</p>'}</div>
   <div class="c"><h3>মোছা বা বদলানো লেখা</h3>${A.map(a=>`<div class="i"><span>${esc(a.tbl)} ${esc(JSON.stringify(a.data).slice(0,90))}<br><small>${esc(P[a.by_user]||'?')} · ${fmt(a.at)}</small></span></div>`).join('')||'<p class="mu">কোনো মোছা লেখা নেই।</p>'}</div>`}
  $('app').innerHTML=tr(`<div class="hd"><div class="lg">${esc((S.shop||'ইউনিক মার্ট').slice(0,1))}</div><div><b>${esc(S.shop||'ইউনিক মার্ট')}</b><small>${role==='admin'?'অ্যাডমিন':'কর্মচারী'}</small></div></div><div class="mq"><span>${esc(S.shop||'ইউনিক মার্ট')} — আজকের বিক্রি ${M(sale)} — মোট বাকি ${M(tot)} — স্বাগতম</span></div>${v}
  <div class="nav">${[['home','হিসাব'],['due','বাকি'],...(role==='admin'?[['rep','রিপোর্ট'],['log','কার্যকলাপ']]:[]),['more','আরও']].map(([k,n])=>`<button class="${tab===k?'a':''}" onclick="tab='${k}';open_=null;render()">${n}</button>`).join('')}</div>`);
}
function detail(){
  const c=C.find(x=>x.id==open_),h=L.filter(x=>x.customer_id==open_);
  return`<button onclick="open_=null;render()">← ফিরে যান</button><div class="c"><h3>${esc(c.name)}</h3><p class="mu">${esc(c.phone||'ফোন নেই')}</p>
  <p>মোট বাকি<br><b class="rd" style="font-size:26px">${M(due(c.id))}</b></p>
  <input id="la" type="number" inputmode="decimal" placeholder="অঙ্ক লিখুন">
  <div class="r"><button onclick="tx('due')">বাকি দিলাম</button><button class="p" onclick="tx('pay')">টাকা পেলাম</button></div></div>
  <div class="c"><h3>মেমো পাঠান</h3><div class="r"><button onclick="send('wa')">WhatsApp</button><button onclick="send('sms')">SMS</button><button onclick="window.print()">প্রিন্ট</button></div></div>
  <div class="c"><h3>ইতিহাস</h3>${[...h].reverse().map(x=>`<div class="i"><span>${x.kind==='due'?'বাকি':'পেলাম'}<br><small>${fmt(x.created_at)}</small></span><span class="${x.kind==='due'?'rd':'gn'}">${Number(x.amount)}${role==='admin'?`<button class="x" aria-label="মুছুন" onclick="del('ledger',${x.id})">✕</button>`:''}</span></div>`).join('')||'<p class="mu">কোনো লেখা নেই।</p>'}
  ${role==='admin'?`<button style="width:100%;margin-top:10px" onclick="del('customers',${c.id})">কাস্টমার মুছুন</button>`:''}</div>`;
}
async function addE(){
  const a=Number($('ea').value),n=$('en').value.trim();
  if(!(a>0))return alert('সঠিক অঙ্ক লিখুন');
  learn(n);
  const{error}=await sb.from('entries').insert({kind:$('ek').value,name:n,amount:a,product_id:(PR.find(x=>x.name===n)||{}).id||null,qty:Number($('eq').value)||1});
  if(error)return alert('সেভ হয়নি, আবার চেষ্টা করুন');load();
}
async function addC(){
  const n=$('cn').value.trim(),p=$('cp').value.trim();
  if(!n)return alert('নাম লিখুন');
  if(p&&!/^[79]\d{6}$/.test(p))return alert('মালদ্বীপের ৭ অঙ্কের নম্বর দিন');
  const{error}=await sb.from('customers').insert({name:n,phone:p});
  if(error)return alert('সেভ হয়নি');load();
}
async function tx(kind){
  const a=Number($('la').value);
  if(!(a>0))return alert('সঠিক অঙ্ক লিখুন');
  if(kind==='pay'&&a>due(open_))return alert('বাকির চেয়ে বেশি লেখা যাবে না');
  const{error}=await sb.from('ledger').insert({customer_id:open_,kind,amount:a});
  if(error)return alert('সেভ হয়নি');await load();
}
function memo(){
  const c=C.find(x=>x.id==open_),l=L.filter(x=>x.customer_id==open_).slice(-1)[0];
  return tr(`${S.shop||'ইউনিক মার্ট'}\nমেমো\nনাম: ${c.name}\nতারিখ: ${new Date().toLocaleString('en-GB')}\n${l?(l.kind==='due'?'বাকি: ':'পেয়েছি: ')+M(l.amount)+'\n':''}মোট বাকি: ${M(due(open_))}\nধন্যবাদ${S.phone?'\nফোন: '+S.phone:''}`);
}
function send(w){
  const c=C.find(x=>x.id==open_);
  if(!c.phone)return alert('এই কাস্টমারের ফোন নম্বর নেই');
  const t=encodeURIComponent(memo());
  location.href=w==='wa'?`https://wa.me/960${c.phone}?text=${t}`:`sms:+960${c.phone}?body=${t}`;
}
async function del(t,id){
  if(role!=='admin')return alert('শুধু অ্যাডমিন মুছতে পারবে');
  if(prompt('পিন দিন')!==(S.pin||'1234'))return alert('পিন ভুল, মোছা হয়নি');
  const{error}=await sb.from(t).delete().eq('id',id);
  if(error)return alert('মোছা যায়নি');if(t==='customers')open_=null;load();
}
async function setS(k,label){
  const v=prompt(label,S[k]||'');if(v===null)return;
  const{error}=await sb.from('settings').upsert({key:k,value:v.trim()});
  if(error)return alert('সেভ হয়নি');load();
}
function backup(){
  const b=new Blob([JSON.stringify({E,C,L,S},null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='unique-mart-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
init();
</script></body></html>
